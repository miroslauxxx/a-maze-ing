[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "maze generator solver"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Hanna Schulze", email = "haschulz@student.42berlin.de" },
    { name = "Miroslau Ilnicki", email = "milnicki@student.42berlin.de" }
]

[project.scripts]
a-maze-ing = "a_maze_ing:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]
